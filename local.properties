GEOAPIFY_API_KEY=03f19346956a41acb6884b9232282a54

# ملاحظة مهمة: المفتاح الذي أرسلته في المحادثة (الذي يبدأ بـ BHMx...) يشبه مفتاح خادم/VAPID
# لإشعارات Push حقيقية (مثل Firebase Cloud Messaging). لم يتم استخدامه في هذه النسخة لأن التطبيق
# لا يحتوي على باك-إند حقيقي بعد (كل شيء وهمي محليًا كما طلبت، عدا الخريطة والمسار).
# الإشعارات الحالية (قبول/رفض السائق، وصول السائق...) هي إشعارات محلية (Local Notifications) فقط.
# عند بناء باك-إند حقيقي (Firebase) لاحقًا، ضع هذا المفتاح هنا وفعّل FCM بدلاً من NotificationHelper المحلي:
# FCM_SERVER_KEY=ضع_المفتاح_هنا
